<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=1.5">
  <title>AC自动机 · AI编程助手</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2">
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #0b0f1c 0%, #1a1f33 100%);
      font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .ac-machine {
      width: 100%;
      max-width: 1400px;
      min-height: 90vh;
      background: rgba(18, 22, 36, 0.85);
      backdrop-filter: blur(20px);
      border-radius: 2.5rem;
      box-shadow: 0 25px 50px -10px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      display: flex;
      overflow: hidden;
      flex-direction: row;
    }

    .left-panel {
      width: 55%;
      background: #0f1322;
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(120, 140, 255, 0.2);
    }

    .left-header {
      padding: 1.2rem 1.5rem;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.5px;
      color: #a8b7ff;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      text-transform: uppercase;
    }

    .user-badge-mini {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-size: 0.75rem;
      text-transform: none;
      color: #8892c4;
    }

    .user-badge-mini .level-display {
      background: rgba(42, 127, 255, 0.15);
      padding: 0.2rem 0.8rem;
      border-radius: 20px;
      border: 1px solid rgba(42, 127, 255, 0.2);
      color: #66d0ff;
    }

    .code-output {
      flex: 1;
      padding: 1.2rem;
      background: #0a0e17;
      margin: 0.8rem;
      border-radius: 1.2rem;
      overflow-y: auto;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      color: #d4d9f0;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid #2a3052;
      box-shadow: inset 0 4px 12px rgba(0,0,0,0.5);
      min-height: 400px;
      max-height: 70vh;
    }

    .code-output:empty::before {
      content: "⚡ AI 生成的代码将显示在这里...";
      color: #4a5070;
      font-style: italic;
      font-size: 1rem;
    }

    .right-panel {
      width: 45%;
      display: flex;
      flex-direction: column;
      background: #13182b;
      padding: 1.2rem;
      gap: 1rem;
    }

    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.2rem;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .settings-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cdd6ff;
      padding: 0.5rem 1.4rem;
      border-radius: 2rem;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
      letter-spacing: 0.3px;
    }

    .settings-btn:hover {
      background: #2f3b6c;
      border-color: #6d83f2;
      color: white;
    }

    .auth-buttons {
      display: flex;
      gap: 0.5rem;
    }

    .auth-btn-small {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cdd6ff;
      padding: 0.4rem 1rem;
      border-radius: 2rem;
      font-weight: 500;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .auth-btn-small:hover {
      background: #2f3b6c;
      border-color: #6d83f2;
      color: white;
    }

    .auth-btn-small.logout {
      border-color: rgba(255, 80, 80, 0.3);
      color: #ff6b6b;
    }

    .auth-btn-small.logout:hover {
      background: rgba(255, 80, 80, 0.15);
      border-color: rgba(255, 80, 80, 0.4);
    }

    .input-card {
      background: rgba(20, 25, 45, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 1.2rem;
      padding: 1.2rem;
      border: 1px solid rgba(100, 120, 255, 0.25);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      flex: 1;
    }

    .field-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8892c4;
      font-weight: 600;
      margin-bottom: 0.2rem;
    }

    .problem-input {
      width: 100%;
      background: #0b0f1e;
      border: 1px solid #2f3a5c;
      border-radius: 0.9rem;
      padding: 0.9rem;
      color: #eef3ff;
      font-size: 0.9rem;
      resize: vertical;
      font-family: inherit;
      min-height: 120px;
      outline: none;
      transition: 0.2s;
    }

    .problem-input:focus {
      border-color: #5f7bfa;
      box-shadow: 0 0 0 3px rgba(95, 123, 250, 0.2);
    }

    .cost-display {
      background: rgba(255, 215, 100, 0.08);
      border: 1px solid rgba(255, 215, 100, 0.15);
      border-radius: 0.7rem;
      padding: 0.6rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #f5d78a;
      font-size: 0.85rem;
    }

    .cost-display .cost-value {
      font-weight: 700;
      font-size: 1.1rem;
      color: #ffd700;
    }

    .cost-display .balance-value {
      font-weight: 700;
      font-size: 1.1rem;
      color: #66d0ff;
    }

    .cost-display .insufficient {
      color: #ff6b6b;
    }

    .submit-btn {
      background: #2a3b8f;
      border: none;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      padding: 0.9rem;
      border-radius: 1.2rem;
      margin-top: 0.5rem;
      cursor: pointer;
      background: linear-gradient(135deg, #3f51b5, #1e2b6f);
      box-shadow: 0 8px 18px rgba(31, 58, 180, 0.4);
      letter-spacing: 0.8px;
      transition: all 0.25s;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .submit-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #5c6bc0, #283593);
      box-shadow: 0 10px 22px rgba(79, 106, 247, 0.5);
      transform: scale(1.01);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      pointer-events: none;
      filter: grayscale(0.4);
    }

    .status-text {
      font-size: 0.8rem;
      color: #a0b0f0;
      margin-top: 0.3rem;
      min-height: 1.2rem;
    }

    /* ===== 新增：底部信息样式 ===== */
    .info-footer {
      margin-top: 0.5rem;
      padding: 0.6rem 1rem;
      background: rgba(20, 25, 45, 0.5);
      border-radius: 0.8rem;
      border: 1px solid rgba(100, 120, 255, 0.1);
      text-align: center;
      font-size: 0.75rem;
      color: #6a7aae;
      line-height: 1.8;
      flex-shrink: 0;
    }
    .info-footer a {
      color: #66d0ff;
      text-decoration: none;
      transition: color 0.2s;
    }
    .info-footer a:hover {
      color: #8ab4ff;
      text-decoration: underline;
    }
    /* ===== 新增结束 ===== */

    .settings-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .settings-modal {
      background: #1a1f38;
      border: 1px solid #40508b;
      border-radius: 2rem;
      padding: 2rem;
      width: 90%;
      max-width: 520px;
      box-shadow: 0 30px 50px rgba(0,0,0,0.7);
      color: #e0e7ff;
    }

    .settings-modal h3 {
      font-size: 1.5rem;
      margin-bottom: 1.8rem;
      color: #c6d4ff;
      border-bottom: 1px solid #2e3a5c;
      padding-bottom: 0.6rem;
    }

    .setting-item {
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .setting-item label {
      font-weight: 500;
      font-size: 0.9rem;
      color: #b4c2f0;
    }

    .setting-item input, .setting-item select {
      background: #0f1424;
      border: 1px solid #334066;
      border-radius: 0.7rem;
      padding: 0.7rem;
      color: white;
      font-size: 0.9rem;
      outline: none;
    }

    .radio-group {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .radio-group label {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-weight: 400;
    }

    .close-settings {
      background: #2f3a66;
      border: none;
      color: white;
      padding: 0.7rem 1.8rem;
      border-radius: 2rem;
      font-weight: 600;
      margin-top: 1rem;
      cursor: pointer;
    }

    .auth-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      z-index: 200;
    }

    .auth-overlay.open {
      display: flex;
    }

    .auth-card {
      background: #1a1f38;
      border: 1px solid #40508b;
      border-radius: 2rem;
      padding: 2rem;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 30px 50px rgba(0,0,0,0.7);
      color: #e0e7ff;
    }

    .auth-card h3 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      text-align: center;
      color: #c6d4ff;
    }

    .auth-card input {
      width: 100%;
      padding: 0.8rem 1rem;
      background: #0f1424;
      border: 1px solid #334066;
      border-radius: 0.7rem;
      color: white;
      font-size: 0.9rem;
      margin-bottom: 1rem;
      outline: none;
    }

    .auth-card input:focus {
      border-color: #5f7bfa;
    }

    .auth-card .auth-actions {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .auth-card .auth-btn {
      padding: 0.8rem;
      border: none;
      border-radius: 0.7rem;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      background: linear-gradient(135deg, #3f51b5, #1e2b6f);
      color: white;
      transition: all 0.2s;
    }

    .auth-card .auth-btn:hover:not(:disabled) {
      transform: scale(1.02);
      box-shadow: 0 8px 18px rgba(31, 58, 180, 0.3);
    }

    .auth-card .auth-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .auth-card .auth-switch {
      background: none;
      border: none;
      color: #8892c4;
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0.3rem;
      transition: 0.2s;
    }

    .auth-card .auth-switch:hover {
      color: #c6d4ff;
    }

    .auth-card .auth-close {
      background: none;
      border: none;
      color: #8892c4;
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0.3rem;
      margin-top: 0.5rem;
    }

    .auth-card .auth-close:hover {
      color: #c6d4ff;
    }

    .toast-message {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 20, 35, 0.9);
      backdrop-filter: blur(12px);
      color: #e6f0ff;
      padding: 0.7rem 2rem;
      border-radius: 60px;
      font-size: 0.95rem;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 999;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .toast-message.show {
      opacity: 1;
    }

    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top: 2px solid white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .ac-machine {
        flex-direction: column;
        height: auto;
        min-height: 95vh;
        border-radius: 1.5rem;
      }
      .left-panel {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid rgba(120, 140, 255, 0.2);
        min-height: 40vh;
      }
      .right-panel {
        width: 100%;
      }
      .code-output {
        min-height: 200px;
        max-height: 50vh;
      }
    }
  </style>
</head>
<body>
<div class="ac-machine">
  <div class="left-panel">
    <div class="left-header">
      <span>⚡ AI 纯代码输出</span>
      <div class="user-badge-mini" id="headerUserInfo">
        <span>未登录</span>
      </div>
    </div>
    <div class="code-output" id="codeDisplay"></div>
  </div>

  <div class="right-panel">
    <div class="settings-row">
      <button class="settings-btn" id="openSettingsBtn">⚙️ 设置</button>
      <div class="auth-buttons" id="authButtons">
        <button class="auth-btn-small" id="loginBtn">登录</button>
        <button class="auth-btn-small" id="registerBtn">注册</button>
      </div>
    </div>

    <div class="input-card">
      <div>
        <div class="field-label">📋 题目要求</div>
        <textarea class="problem-input" id="problemDescription" placeholder="例如：给定一个整数数组 nums 和一个目标值 target，请你在该数组中找出和为目标值的那两个整数，并返回它们的数组下标。"></textarea>
      </div>

      <div class="cost-display">
        <span>🌟 本次消耗</span>
        <span class="cost-value">1 等级</span>
        <span>|</span>
        <span>📊 当前等级: <span class="balance-value" id="levelDisplay">0</span></span>
      </div>

      <button class="submit-btn" id="solveBtn">🚀 消耗1级生成代码</button>
      <div class="status-text" id="statusMessage"></div>
    </div>

    <!-- ===== 新增：信息底部 ===== -->
    <div class="info-footer">
      🏆 洛谷团队: <a href="https://www.luogu.com.cn/team/121453" target="_blank">www.luogu.com.cn/team/121453</a><br>
      🌐 官网: <a href="https://danielchouhn.github.io/CppGames" target="_blank">danielchouhn.github.io/CppGames</a>
    </div>
    <!-- ===== 新增结束 ===== -->
  </div>
</div>

<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-modal">
    <h3>🧠 提示词配置</h3>
    <div class="setting-item">
      <label>📌 使用算法 (自定义描述)</label>
      <input type="text" id="algorithmInput" placeholder="例如：动态规划 / 双指针 / 图论DFS">
    </div>
    <div class="setting-item">
      <label>📝 是否添加详细题目思路作为注释</label>
      <div class="radio-group">
        <label><input type="radio" name="addComment" value="是"> 是</label>
        <label><input type="radio" name="addComment" value="否" checked> 否</label>
      </div>
    </div>
    <div class="setting-item">
      <label>💻 使用语言</label>
      <select id="languageSelect">
        <option value="python">Python</option>
        <option value="c++" selected>C++</option>
      </select>
    </div>
    <div class="setting-item">
      <label>🤖 使用AI (锁定)</label>
      <input type="text" value="deepseek-v4-flash" disabled style="opacity:0.7; background:#1b1f30;">
    </div>
    <button class="close-settings" id="closeSettingsBtn">保存并关闭</button>
  </div>
</div>

<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <h3 id="authTitle">登录</h3>
    <input type="text" id="authUsername" placeholder="用户名" autocomplete="off">
    <input type="password" id="authPassword" placeholder="密码 (至少6位)">
    <div class="auth-actions">
      <button class="auth-btn" id="authConfirmBtn">登录</button>
      <button class="auth-switch" id="authSwitchBtn">没有账号？去注册</button>
      <button class="auth-close" id="authCloseBtn">取消</button>
    </div>
  </div>
</div>

<div class="toast-message" id="toast"></div>

<script>
  (function() {
    // ============ Supabase 配置 ============
    const SUPABASE_URL = 'https://rihfowjielhukozkrzoq.supabase.co/';
    const SUPABASE_ANON_KEY =
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJpaGZvd2ppZWxodWtvemtyem9xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzODY5MjksImV4cCI6MjA5ODk2MjkyOX0.xGximEvs6ZORcXjjWcJftu-fRvQkkpIZI0tWzixnYD0';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ============ Edge Function URL ============
    const AI_PROXY_URL = 'https://rihfowjielhukozkrzoq.supabase.co/functions/v1/ai-proxy';

    // ============ DOM 元素 ============
    const codeDisplay = document.getElementById('codeDisplay');
    const problemDesc = document.getElementById('problemDescription');
    const solveBtn = document.getElementById('solveBtn');
    const statusMsg = document.getElementById('statusMessage');
    const levelDisplay = document.getElementById('levelDisplay');
    const headerUserInfo = document.getElementById('headerUserInfo');

    const openSettingsBtn = document.getElementById('openSettingsBtn');
    const settingsOverlay = document.getElementById('settingsOverlay');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');
    const algorithmInput = document.getElementById('algorithmInput');
    const commentRadios = document.getElementsByName('addComment');
    const languageSelect = document.getElementById('languageSelect');

    const authOverlay = document.getElementById('authOverlay');
    const authTitle = document.getElementById('authTitle');
    const authUsername = document.getElementById('authUsername');
    const authPassword = document.getElementById('authPassword');
    const authConfirmBtn = document.getElementById('authConfirmBtn');
    const authSwitchBtn = document.getElementById('authSwitchBtn');
    const authCloseBtn = document.getElementById('authCloseBtn');
    const loginBtn = document.getElementById('loginBtn');
    const registerBtn = document.getElementById('registerBtn');
    const authButtons = document.getElementById('authButtons');

    const toastEl = document.getElementById('toast');

    // ============ 状态 ============
    const AI_MODEL = "deepseek-v4-flash";
    const COST_PER_GENERATION = 1;

    let currentUser = null;
    let userProfile = null;
    let isAuthLoginMode = true;
    let isGenerating = false;

    // ============ Toast ============
    function showToast(msg, duration = 2800) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastEl._timer);
      toastEl._timer = setTimeout(() => toastEl.classList.remove('show'), duration);
    }

    // ============ 用户相关 ============
    async function checkAuth() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session?.user) {
        currentUser = session.user;
        await loadUserProfile(currentUser.id);
      } else {
        currentUser = null;
        userProfile = null;
      }
      updateUI();
    }

    async function loadUserProfile(userId) {
      const { data, error } = await supabase
        .from('profiles')
        .select('username, honor, level, exp')
        .eq('id', userId)
        .maybeSingle();

      if (error) {
        console.warn('获取profile失败', error);
        return;
      }

      if (data) {
        userProfile = {
          username: data.username || '玩家',
          honor: data.honor || '玩家',
          level: data.level || 1,
          exp: data.exp || 0,
          id: userId
        };
        currentUser.user_metadata = {
          ...currentUser.user_metadata,
          username: userProfile.username
        };
      } else {
        const fallbackUsername = currentUser.user_metadata?.username || '玩家';
        const { error: insertError } = await supabase
          .from('profiles')
          .insert([{ id: userId, username: fallbackUsername, honor: '玩家', level: 1, exp: 0 }]);
        if (insertError) {
          console.warn('创建profile失败', insertError);
        }
        userProfile = {
          username: fallbackUsername,
          honor: '玩家',
          level: 1,
          exp: 0,
          id: userId
        };
      }
      updateUI();
    }

    async function deductLevel(userId) {
      if (!userProfile || userProfile.level < 1) {
        return false;
      }

      const newLevel = userProfile.level - 1;
      const { error } = await supabase
        .from('profiles')
        .update({ level: newLevel })
        .eq('id', userId);

      if (error) {
        console.warn('扣除等级失败', error);
        return false;
      }

      userProfile.level = newLevel;
      updateUI();
      return true;
    }

    async function syncUserProfile(userId) {
      const { data, error } = await supabase
        .from('profiles')
        .select('username, honor, level, exp')
        .eq('id', userId)
        .maybeSingle();

      if (error) {
        console.warn('同步profile失败', error);
        return;
      }

      if (data) {
        userProfile = {
          username: data.username || '玩家',
          honor: data.honor || '玩家',
          level: data.level || 1,
          exp: data.exp || 0,
          id: userId
        };
      }
      updateUI();
    }

    // ============ UI更新 ============
    function updateUI() {
      if (currentUser && userProfile) {
        headerUserInfo.innerHTML = `
          <span>👤 ${userProfile.username}</span>
          <span class="level-display">Lv.${userProfile.level}</span>
        `;
      } else {
        headerUserInfo.innerHTML = `<span>🔒 未登录</span>`;
      }

      if (currentUser) {
        authButtons.innerHTML = `
          <span style="font-size:0.75rem;color:#8892c4;">${userProfile?.username || '用户'}</span>
          <button class="auth-btn-small logout" id="logoutBtn">退出</button>
        `;
        document.getElementById('logoutBtn')?.addEventListener('click', handleLogout);
      } else {
        authButtons.innerHTML = `
          <button class="auth-btn-small" id="loginBtn">登录</button>
          <button class="auth-btn-small" id="registerBtn">注册</button>
        `;
        document.getElementById('loginBtn')?.addEventListener('click', () => openAuthModal(true));
        document.getElementById('registerBtn')?.addEventListener('click', () => openAuthModal(false));
      }

      if (userProfile) {
        levelDisplay.textContent = userProfile.level;
        levelDisplay.className = 'balance-value' + (userProfile.level < 1 ? ' insufficient' : '');
      } else {
        levelDisplay.textContent = '0';
        levelDisplay.className = 'balance-value insufficient';
      }

      updateSolveButton();
    }

    function updateSolveButton() {
      const hasLevel = userProfile && userProfile.level >= 1;
      const isLoggedIn = !!currentUser;

      if (!isLoggedIn) {
        solveBtn.textContent = '🔒 请先登录';
        solveBtn.disabled = true;
      } else if (!hasLevel) {
        solveBtn.textContent = `❌ 等级不足 (需要 ≥1级)`;
        solveBtn.disabled = true;
      } else {
        solveBtn.textContent = `🚀 消耗1级生成代码`;
        solveBtn.disabled = false;
      }
    }

    // ============ 认证功能 ============
    function openAuthModal(isLoginMode) {
      isAuthLoginMode = isLoginMode;
      authTitle.textContent = isLoginMode ? '🔐 登录' : '📝 注册';
      authConfirmBtn.textContent = isLoginMode ? '登录' : '注册';
      authSwitchBtn.textContent = isLoginMode ? '没有账号？去注册' : '已有账号？去登录';
      authUsername.value = '';
      authPassword.value = '';
      authOverlay.classList.add('open');
    }

    function closeAuthModal() {
      authOverlay.classList.remove('open');
    }

    authCloseBtn.addEventListener('click', closeAuthModal);
    authOverlay.addEventListener('click', (e) => {
      if (e.target === authOverlay) closeAuthModal();
    });

    authSwitchBtn.addEventListener('click', () => {
      openAuthModal(!isAuthLoginMode);
    });

    authConfirmBtn.addEventListener('click', async () => {
      const username = authUsername.value.trim();
      const password = authPassword.value.trim();

      if (!username) {
        showToast('请输入用户名');
        return;
      }
      if (!password || password.length < 6) {
        showToast('密码至少需要6位');
        return;
      }

      authConfirmBtn.disabled = true;
      authConfirmBtn.textContent = '处理中...';

      try {
        if (isAuthLoginMode) {
          const email = `${username}@mygame.com`;
          const { data, error } = await supabase.auth.signInWithPassword({
            email,
            password
          });

          if (error) {
            showToast('❌ 登录失败: ' + error.message);
          } else {
            showToast('✅ 登录成功!');
            closeAuthModal();
            await checkAuth();
          }
        } else {
          const { data: existingUser, error: checkError } = await supabase
            .from('profiles')
            .select('username')
            .eq('username', username)
            .maybeSingle();

          if (checkError) {
            showToast('验证用户名失败: ' + checkError.message);
            return;
          }
          if (existingUser) {
            showToast('❌ 用户名已被使用');
            return;
          }

          const email = `${username}@mygame.com`;
          const { data: signUpData, error: signUpError } = await supabase.auth.signUp({
            email: email,
            password: password,
            options: {
              data: { username: username }
            }
          });

          if (signUpError) {
            showToast('❌ 注册失败: ' + signUpError.message);
            return;
          }

          if (signUpData.user) {
            const { error: profileError } = await supabase
              .from('profiles')
              .upsert([{
                id: signUpData.user.id,
                username: username,
                honor: '玩家',
                level: 1,
                exp: 0
              }], { onConflict: 'id' });

            if (profileError) {
              showToast('⚠️ 账号创建成功，但保存用户信息失败');
              console.error('Profile插入失败:', profileError);
            }

            showToast('🎉 注册成功! 欢迎 ' + username);
            closeAuthModal();
            await checkAuth();
          }
        }
      } catch (e) {
        showToast('发生错误: ' + e.message);
      } finally {
        authConfirmBtn.disabled = false;
        authConfirmBtn.textContent = isAuthLoginMode ? '登录' : '注册';
      }
    });

    async function handleLogout() {
      await supabase.auth.signOut();
      currentUser = null;
      userProfile = null;
      updateUI();
      showToast('已退出');
    }

    // ============ 设置面板 ============
    function openSettings() {
      settingsOverlay.style.display = 'flex';
    }

    function closeSettings() {
      settingsOverlay.style.display = 'none';
    }

    openSettingsBtn.addEventListener('click', openSettings);
    closeSettingsBtn.addEventListener('click', closeSettings);
    settingsOverlay.addEventListener('click', function(e) {
      if (e.target === settingsOverlay) closeSettings();
    });

    function getAddCommentSetting() {
      for (let radio of commentRadios) {
        if (radio.checked) return radio.value;
      }
      return '是';
    }

    // ============ 构建系统提示词 ============
    function buildSystemPrompt() {
      const algorithm = algorithmInput.value.trim();
      const addComment = getAddCommentSetting();
      const language = languageSelect.value;

      let algoLine = algorithm ? `使用算法/思路：${algorithm}。` : '使用最合适的算法解决问题。';
      let commentInstruction = '';
      if (addComment === '是') {
        commentInstruction = `必须在代码中以注释形式详细写出解题思路、算法步骤和复杂度分析。`;
      } else {
        commentInstruction = `不需要添加额外的解释注释，只输出纯代码。`;
      }

      return `你是一个顶尖的编程竞赛助手。${algoLine}请使用${language}语言编写解决方案。${commentInstruction}你的回复必须只包含代码块或纯代码，不要包含任何解释性文字（除了要求的注释外），不要使用markdown代码块标记。直接输出可运行的代码。`;
    }

    // ============ 调用API生成代码 ============
    async function generateCode() {
      if (isGenerating) return;

      const problem = problemDesc.value.trim();
      if (!problem) {
        statusMsg.textContent = '⚠️ 请输入题目要求';
        return;
      }

      if (!currentUser) {
        statusMsg.textContent = '🔒 请先登录';
        return;
      }

      if (!userProfile || userProfile.level < 1) {
        statusMsg.textContent = `❌ 等级不足！需要 ≥1级，当前 ${userProfile?.level || 0} 级`;
        return;
      }

      // 扣除1级
      const deducted = await deductLevel(currentUser.id);
      if (!deducted) {
        statusMsg.textContent = '❌ 扣除等级失败，请重试';
        return;
      }

      isGenerating = true;
      solveBtn.disabled = true;
      solveBtn.innerHTML = '<span class="loading-spinner"></span>生成中...';
      statusMsg.textContent = `🌟 已消耗1级，剩余 ${userProfile.level} 级，生成代码中...`;
      codeDisplay.textContent = '';

      const systemPrompt = buildSystemPrompt();
      const userMessage = `题目描述：\n${problem}`;

      try {
        const response = await fetch(AI_PROXY_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          },
          body: JSON.stringify({
            model: AI_MODEL,
            messages: [
              { role: 'system', content: systemPrompt },
              { role: 'user', content: userMessage }
            ],
            temperature: 0.2,
            max_tokens: 4096
          })
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.error?.message || `HTTP ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();
        
        if (data.error) {
          throw new Error(data.error.message || '未知错误');
        }

        let aiText = '';
        if (data.choices && data.choices.length > 0) {
          aiText = data.choices[0].message?.content || '';
        } else if (data.content) {
          aiText = data.content;
        } else {
          aiText = JSON.stringify(data);
        }

        let cleanedCode = aiText;
        const codeBlockRegex = /```[\w]*\n?([\s\S]*?)```/g;
        const match = codeBlockRegex.exec(aiText);
        if (match && match[1]) {
          cleanedCode = match[1].trim();
        } else {
          cleanedCode = aiText.replace(/^```[\w]*\n?/g, '').replace(/```$/g, '').trim();
        }

        codeDisplay.textContent = cleanedCode || aiText;
        statusMsg.textContent = `✅ 代码生成完毕 (剩余 ${userProfile.level} 级)`;

      } catch (err) {
        console.error('生成错误:', err);
        statusMsg.textContent = `⚠️ 错误: ${err.message}`;
        codeDisplay.textContent = `// 请求失败: ${err.message}`;

        // 生成失败，退还等级
        const { error: refundError } = await supabase
          .from('profiles')
          .update({ level: userProfile.level + 1 })
          .eq('id', currentUser.id);

        if (!refundError) {
          userProfile.level += 1;
          showToast('⚠️ 生成失败，已退还1级');
        }
        await syncUserProfile(currentUser.id);
      } finally {
        isGenerating = false;
        solveBtn.innerHTML = '🚀 消耗1级生成代码';
        solveBtn.disabled = false;
        updateSolveButton();
      }
    }

    // ============ 事件绑定 ============
    solveBtn.addEventListener('click', generateCode);

    problemDesc.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 'Enter') {
        solveBtn.click();
      }
    });

    // ============ 初始化 ============
    async function init() {
      await checkAuth();

      supabase.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_IN' && session?.user) {
          currentUser = session.user;
          loadUserProfile(currentUser.id);
        } else if (event === 'SIGNED_OUT') {
          currentUser = null;
          userProfile = null;
          updateUI();
        }
      });

      updateUI();
    }

    init();

  })();
</script>
</body>
</html>
